name: Deploy Corona Real Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Corona Real
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package.json

      - name: Install isolated Cloudflare tooling
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Validate required secrets and D1 configuration
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Falta el secreto CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Falta el secreto CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$API_ADMIN_TOKEN" || (echo "Falta el secreto API_ADMIN_TOKEN" && exit 1)
          grep -q 'REEMPLAZAR_CON_EL_ID_REAL_DE_D1' ../wrangler.toml && (echo "Reemplazá database_id en wrangler.toml por el ID real de corona-real-db" && exit 1) || true

      - name: Configure API admin secret in Cloudflare
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_ADMIN_TOKEN: ${{ secrets.API_ADMIN_TOKEN }}
        run: |
          printf '%s' "$API_ADMIN_TOKEN" | npx wrangler secret put API_ADMIN_TOKEN --config ../wrangler.toml --account-id "$CLOUDFLARE_ACCOUNT_ID"

      - name: Apply D1 schema
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute corona-real-db --remote --file=schema.sql --config ../wrangler.toml --account-id "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config ../wrangler.toml --account-id "$CLOUDFLARE_ACCOUNT_ID"
